<title>Workout Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
  /* Layout: full-page app, sticky header, scrollable workout content */
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #e4e7ed;
    --fg: #1a1d23;
    --fg-2: #5a6072;
    --fg-3: #9199ad;

    /* Day accent colors */
    --day-a: #1e3a6e;
    --day-a-light: #dce9ff;
    --day-b: #0f5c52;
    --day-b-light: #d4f0ec;
    --day-c: #7a3c00;
    --day-c-light: #ffecd4;
    --day-d: #4a1d7a;
    --day-d-light: #eddff8;

    --complete: #16a34a;
    --complete-bg: #dcfce7;
    --mono: 'DM Mono', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13151a;
      --surface: #1e2128;
      --surface-2: #262b35;
      --border: #333846;
      --fg: #e8eaf0;
      --fg-2: #9199ad;
      --fg-3: #5a6072;
      --day-a: #5b8fd6;
      --day-a-light: #1a2a42;
      --day-b: #4dbda8;
      --day-b-light: #102921;
      --day-c: #e8853d;
      --day-c-light: #2a1a08;
      --day-d: #a97fdd;
      --day-d-light: #221540;
      --complete: #4ade80;
      --complete-bg: #052e16;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13151a;
    --surface: #1e2128;
    --surface-2: #262b35;
    --border: #333846;
    --fg: #e8eaf0;
    --fg-2: #9199ad;
    --fg-3: #5a6072;
    --day-a: #5b8fd6;
    --day-a-light: #1a2a42;
    --day-b: #4dbda8;
    --day-b-light: #102921;
    --day-c: #e8853d;
    --day-c-light: #2a1a08;
    --day-d: #a97fdd;
    --day-d-light: #221540;
    --complete: #4ade80;
    --complete-bg: #052e16;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    line-height: 1.5;
  }

  body {
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }

  /* ── Header ── */
  .app-header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: var(--surface);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .app-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .app-title span {
    font-weight: 400;
    color: var(--fg-2);
    font-size: 14px;
    margin-left: 6px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ── Day selector ── */
  .day-selector {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px 0 16px;
  }

  .day-btn {
    width: 100%;
    padding: 18px 20px;
    border: 2px solid var(--border);
    background: var(--surface);
    border-radius: 14px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
    font-family: inherit;
    color: var(--fg-2);
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .day-btn .day-label {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    font-family: var(--mono);
    flex-shrink: 0;
    width: 36px;
  }

  .day-btn .day-sub {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .day-btn:hover {
    border-color: var(--accent);
    background: var(--accent-light);
    color: var(--accent);
  }

  .day-btn.active {
    border-color: var(--accent);
    background: var(--accent-light);
    color: var(--accent);
  }

  .day-btn[data-day="A"] { --accent: var(--day-a); --accent-light: var(--day-a-light); }
  .day-btn[data-day="B"] { --accent: var(--day-b); --accent-light: var(--day-b-light); }
  .day-btn[data-day="C"] { --accent: var(--day-c); --accent-light: var(--day-c-light); }
  .day-btn[data-day="D"] { --accent: var(--day-d); --accent-light: var(--day-d-light); }

  /* ── Main content ── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 100px;
  }

  /* ── Workout header ── */
  .workout-header {
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .workout-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  .workout-meta {
    font-size: 12px;
    color: var(--fg-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
  }

  .workout-timer {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 500;
    color: var(--fg-2);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* ── Progress bar ── */
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 0.3s ease;
    width: 0%;
  }

  /* ── Exercise cards ── */
  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }

  .exercise-card.completed {
    border-color: var(--complete);
    background: var(--complete-bg);
  }

  .exercise-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px 16px 14px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .exercise-num {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--fg-3);
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.15s;
  }

  .exercise-card.completed .exercise-num {
    background: var(--complete);
    color: white;
  }

  .exercise-info {
    flex: 1;
    min-width: 0;
  }

  .exercise-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }

  .exercise-target {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
  }

  .exercise-equip {
    font-size: 12px;
    color: var(--fg-3);
    margin-top: 2px;
  }

  .exercise-note {
    font-size: 12px;
    color: var(--fg-2);
    margin-top: 3px;
    font-style: italic;
  }

  .expand-icon {
    color: var(--fg-3);
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 8px;
    transition: transform 0.2s;
  }

  .exercise-card.expanded .expand-icon { transform: rotate(180deg); }

  /* ── Set logger ── */
  .sets-panel {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
  }

  .exercise-card.expanded .sets-panel { display: block; }

  .sets-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--fg-3);
    font-weight: 600;
    padding-top: 12px;
    margin-bottom: 10px;
  }

  .sets-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .set-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 12px 14px;
    transition: background 0.15s;
  }

  .set-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .set-row-bottom {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .set-row.set-done {
    background: var(--complete-bg);
    border: 1px solid var(--complete);
  }

  .set-label {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--fg-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .set-target {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
  }

  .rep-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .rep-btn {
    width: 48px;
    height: 48px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
    color: var(--fg-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: inherit;
    transition: all 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .rep-btn:hover { background: var(--surface-2); color: var(--fg); }
  .rep-btn:active { transform: scale(0.92); }

  .rep-input {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    height: 48px;
    padding: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    border-radius: 10px;
    -moz-appearance: textfield;
  }

  .rep-input::-webkit-outer-spin-button,
  .rep-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .rep-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: transparent;
  }

  .log-set-btn {
    display: block;
    width: 100%;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: opacity 0.15s, transform 0.1s;
  }

  .log-set-btn:hover { opacity: 0.88; }
  .log-set-btn:active { transform: scale(0.96); }

  .set-done .log-set-btn {
    background: var(--complete);
  }

  .set-check {
    display: none;
    text-align: center;
    font-size: 26px;
    padding: 6px 0;
  }

  .set-done .set-check { display: block; }
  .set-done .log-set-btn { display: none; }

  /* ── Finish panel ── */
  .finish-panel {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 20px;
    margin-top: 8px;
    display: none;
  }

  .finish-panel.visible { display: block; }

  .finish-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--accent);
  }

  .finish-summary {
    font-size: 13px;
    color: var(--fg-2);
    margin-bottom: 16px;
    line-height: 1.6;
  }

  /* ── Sheets connect ── */
  .sheets-section {
    padding: 16px;
    background: var(--surface-2);
    border-radius: 10px;
    margin-bottom: 12px;
  }

  .sheets-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sheets-icon {
    width: 18px;
    height: 18px;
    background: #0f9d58;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
    font-family: var(--mono);
  }

  .input-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-3);
    font-weight: 600;
    margin-bottom: 3px;
  }

  .text-input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 13px;
  }

  .text-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: transparent;
  }

  .text-input::placeholder { color: var(--fg-3); }

  .api-help {
    font-size: 11px;
    color: var(--fg-3);
    margin-top: 4px;
    line-height: 1.5;
  }

  /* ── Buttons ── */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 11px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-2);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.12s;
  }

  .btn-secondary:hover { background: var(--surface-2); }

  /* ── Status toast ── */
  .toast {
    position: fixed;
    bottom: max(24px, env(safe-area-inset-bottom, 24px));
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--fg);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    transition: transform 0.3s ease;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    pointer-events: none;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--complete); color: white; }
  .toast.error { background: #dc2626; color: white; }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--fg-3);
  }

  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 17px; color: var(--fg-2); margin-bottom: 6px; }
  .empty-state p { font-size: 13px; line-height: 1.6; }

  /* ── Workout accent scoping ── */
  .workout-wrap[data-day="A"] { --accent: var(--day-a); --accent-light: var(--day-a-light); }
  .workout-wrap[data-day="B"] { --accent: var(--day-b); --accent-light: var(--day-b-light); }
  .workout-wrap[data-day="C"] { --accent: var(--day-c); --accent-light: var(--day-c-light); }
  .workout-wrap[data-day="D"] { --accent: var(--day-d); --accent-light: var(--day-d-light); }

  /* ── History log ── */
  .history-section {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .history-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--fg-3);
    margin-bottom: 12px;
  }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .history-item:last-child { border-bottom: none; }

  .history-day {
    font-weight: 700;
    font-family: var(--mono);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
  }

  .history-date { color: var(--fg-2); }
  .history-sets { color: var(--fg-3); font-family: var(--mono); font-size: 12px; }

  .clear-history {
    font-size: 12px;
    color: var(--fg-3);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    font-family: inherit;
    text-decoration: underline;
    margin-top: 8px;
  }

  .clear-history:hover { color: #dc2626; }

  @media (max-width: 500px) {
    .workout-timer { font-size: 22px; }
  }
</style>

<!-- ── App structure ── -->
<div class="app-header">
  <div class="header-inner">
    <div class="app-title">Workout Tracker <span id="todayDate"></span></div>
    <div class="header-actions">
      <div class="workout-timer" id="timer">0:00</div>
    </div>
  </div>
</div>

<div class="content">
  <!-- Day selector -->
  <div class="day-selector">
    <button class="day-btn" data-day="A" onclick="selectDay('A')">
      <span class="day-label">A</span>
      <span class="day-sub">Lower</span>
    </button>
    <button class="day-btn" data-day="B" onclick="selectDay('B')">
      <span class="day-label">B</span>
      <span class="day-sub">Push/Pull</span>
    </button>
    <button class="day-btn" data-day="C" onclick="selectDay('C')">
      <span class="day-label">C</span>
      <span class="day-sub">Power</span>
    </button>
    <button class="day-btn" data-day="D" onclick="selectDay('D')">
      <span class="day-label">D</span>
      <span class="day-sub">Mobility</span>
    </button>
  </div>

  <!-- Workout content injected here -->
  <div id="workoutArea">
    <div class="empty-state">
      <div class="empty-icon">💪</div>
      <h3>Choose your workout</h3>
      <p>Select Day A, B, C, or D above<br>to load today's exercises.</p>
    </div>
  </div>

  <!-- History -->
  <div class="history-section" id="historySection" hidden>
    <div class="history-title">Recent Workouts</div>
    <div id="historyList"></div>
    <button class="clear-history" onclick="clearHistory()">Clear history</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Workout data ──
const WORKOUTS = {
  A: {
    label: 'Day A',
    subtitle: 'Lower Body Focus',
    exercises: [
      {
        name: 'Goblet Squat',

      },
      {

        sets: 2, repsTarget: '30 sec',

  B: {

      {
        name: 'Pull-ups / Chin-ups',

      },
      {
        name: 'TRX Push-up',
        sets: 3, repsTarget: '10–12',
        equipment: 'TRX',
        note: 'Feet on floor, hands in TRX handles — more unstable than floor push-up'
      },
      {
        name: 'TRX Row',
        sets: 3, repsTarget: '12',
        equipment: 'TRX',
        note: 'Body at 45° — pull chest to hands. Harder = more horizontal body angle'
      },
      {
        name: 'DB Shoulder Press',
        sets: 3, repsTarget: '10',
        equipment: '2× 25 lb DB',
        note: 'Seated or standing — press straight up, controlled descent'
      },
      {
        name: 'Band Face Pull',

// ── State ──
let currentDay = null;
let workoutState = {}; // { exIdx: { setIdx: repsLogged } }
let workoutStartTime = null;
let timerInterval = null;
let workoutHistory = [];

// ── Init ──
(function init() {
  // Date
  const d = new Date();
  document.getElementById('todayDate').textContent =
    d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

  // Load history from localStorage
  try {
    const stored = localStorage.getItem('workout_history');
    if (stored) workoutHistory = JSON.parse(stored);
  } catch(e) {}

  renderHistory();
  loadSettings();
})();

// ── Day selection ──
function selectDay(day) {
  currentDay = day;
  workoutState = {};

  // Update button active state
  document.querySelectorAll('.day-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.day === day);
  });

  // Start timer
  if (timerInterval) clearInterval(timerInterval);
  workoutStartTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();

  renderWorkout(day);
}

function updateTimer() {
  if (!workoutStartTime) return;
  const elapsed = Math.floor((Date.now() - workoutStartTime) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

// ── Render workout ──
function renderWorkout(day) {
  const w = WORKOUTS[day];
  const area = document.getElementById('workoutArea');

  let totalSets = 0;
  w.exercises.forEach(ex => totalSets += ex.sets);

  let html = `<div class="workout-wrap" data-day="${day}">
    <div class="workout-header">
      <div>
        <div class="workout-title">${w.label}: ${w.subtitle}</div>
        <div class="workout-meta">⏱ 15 min · ${w.exercises.length} exercises · ${totalSets} sets</div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  `;

  w.exercises.forEach((ex, ei) => {
    html += buildExerciseCard(ex, ei, day, totalSets);
  });

  html += buildFinishPanel(day, totalSets);
  html += `</div>`;

  area.innerHTML = html;
  updateProgress();
}

function buildExerciseCard(ex, ei, day, totalSets) {
  let setsHtml = '';
  for (let si = 0; si < ex.sets; si++) {
    const id = `set_${ei}_${si}`;
    setsHtml += `
      <div class="set-row" id="${id}">
        <div class="set-row-top">
          <span class="set-label">Set ${si + 1}</span>
          <span class="set-target">${ex.repsTarget}</span>
        </div>
        <div class="set-row-bottom">
          <button class="rep-btn" onclick="adjustRep('${id}_input', -1)" tabindex="-1">−</button>
          <input class="rep-input" type="number" id="${id}_input"
            min="0" max="50" value="${getDefaultRep(ex.repsTarget)}"
            oninput="clampInput(this)">
          <button class="rep-btn" onclick="adjustRep('${id}_input', 1)" tabindex="-1">+</button>
        </div>
        <button class="log-set-btn" onclick="logSet(${ei}, ${si}, '${id}', '${day}', '${ex.name}', '${ex.repsTarget}')">Log Set</button>
        <span class="set-check">✓</span>
      </div>`;
  }

  return `
    <div class="exercise-card" id="exCard_${ei}" onclick="toggleExpand(${ei}, event)">
      <div class="exercise-header">
        <div class="exercise-num" id="exNum_${ei}">${ei + 1}</div>
        <div class="exercise-info">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-target">${ex.sets} sets × ${ex.repsTarget}</div>
          <div class="exercise-equip">${ex.equipment}</div>
          <div class="exercise-note">${ex.note}</div>
        </div>
        <span class="expand-icon">▾</span>
      </div>
      <div class="sets-panel">
        <div class="sets-label">Log your sets</div>
        <div class="sets-grid">${setsHtml}</div>
      </div>
    </div>`;
}

function buildFinishPanel(day, totalSets) {
  return `
    <div class="finish-panel" id="finishPanel">
      <div class="finish-title">🎉 Workout Complete!</div>
      <div class="finish-summary" id="finishSummary"></div>

      <div class="sheets-section">
        <div class="sheets-title">
          <span class="sheets-icon">S</span> Save to Google Sheets
        </div>
        <div class="input-row">
          <div>
            <div class="field-label">Apps Script Web App URL</div>
            <input class="text-input" type="text" id="scriptUrl"
              placeholder="https://script.google.com/macros/s/…/exec">
            <div class="api-help">
              In your Google Sheet: <strong>Extensions → Apps Script</strong>, paste the script below, then <strong>Deploy → New deployment → Web app</strong> (Execute as: Me, Access: Anyone). Copy the URL it gives you and paste it here.
            </div>
          </div>
        </div>
        <details style="margin-top:10px">
          <summary style="font-size:12px;color:var(--fg-3);cursor:pointer;user-select:none">Show Apps Script code to paste ▾</summary>
          <pre style="margin-top:8px;padding:10px;background:var(--bg);border-radius:6px;font-size:11px;overflow-x:auto;line-height:1.5;color:var(--fg-2)">function doPost(e) {
  const sheet = SpreadsheetApp
    .getActiveSpreadsheet()
    .getActiveSheet();
  const data = JSON.parse(e.postData.contents);
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(
      ['Date','Time','Day','Exercise','Set','Reps']
    );
  }
  data.rows.forEach(row => sheet.appendRow(row));
  return ContentService
    .createTextOutput(
      JSON.stringify({success:true})
    )
    .setMimeType(ContentService.MimeType.JSON);
}</pre>
        </details>
      </div>

      <button class="btn-primary" id="saveBtn" onclick="saveToSheets()" style="--accent: var(--day-${day.toLowerCase()})">
        Save workout to Google Sheets
      </button>
      <button class="btn-secondary" onclick="copyWorkoutCSV()">
        Copy as CSV (manual import)
      </button>
    </div>`;
}

// ── Default rep value from target string ──
function getDefaultRep(target) {
  const m = target.match(/^(\d+)/);
  return m ? parseInt(m[1]) : 10;
}

function clampInput(input) {
  const v = parseInt(input.value);
  if (isNaN(v) || v < 0) input.value = 0;
  if (v > 99) input.value = 99;
}

function adjustRep(inputId, delta) {
  const input = document.getElementById(inputId);
  const val = parseInt(input.value) || 0;
  input.value = Math.max(0, Math.min(99, val + delta));
}

// ── Toggle exercise expand ──
function toggleExpand(ei, e) {
  // Don't collapse if clicking set controls
  if (e.target.closest('.sets-panel')) return;
  const card = document.getElementById(`exCard_${ei}`);
  card.classList.toggle('expanded');
}

// ── Log a set ──
function logSet(ei, si, rowId, day, exerciseName, repsTarget) {
  const input = document.getElementById(`${rowId}_input`);
  const reps = parseInt(input.value) || 0;

  if (!workoutState[ei]) workoutState[ei] = {};
  workoutState[ei][si] = reps;

  const row = document.getElementById(rowId);
  row.classList.add('set-done');

  const w = WORKOUTS[day];
  const ex = w.exercises[ei];

  // Check if all sets for this exercise are done
  const allSetsForEx = Object.keys(workoutState[ei] || {}).length;
  if (allSetsForEx >= ex.sets) {
    const card = document.getElementById(`exCard_${ei}`);
    card.classList.add('completed');
    // Show checkmark on num
    document.getElementById(`exNum_${ei}`).textContent = '✓';
  }

  updateProgress();
}

// ── Progress ──
function updateProgress() {
  if (!currentDay) return;
  const w = WORKOUTS[currentDay];
  let totalSets = 0, loggedSets = 0;

  w.exercises.forEach((ex, ei) => {
    totalSets += ex.sets;
    if (workoutState[ei]) {
      loggedSets += Math.min(Object.keys(workoutState[ei]).length, ex.sets);
    }
  });

  const pct = totalSets > 0 ? (loggedSets / totalSets) * 100 : 0;
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';

  // Show finish panel when all sets logged
  if (loggedSets >= totalSets && totalSets > 0) {
    showFinishPanel();
  }
}

function showFinishPanel() {
  const panel = document.getElementById('finishPanel');
  if (!panel) return;
  panel.classList.add('visible');

  const elapsed = workoutStartTime ? Math.floor((Date.now() - workoutStartTime) / 1000) : 0;
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;

  let totalSets = 0, totalReps = 0;
  const w = WORKOUTS[currentDay];
  w.exercises.forEach((ex, ei) => {
    totalSets += ex.sets;
    if (workoutState[ei]) {
      Object.values(workoutState[ei]).forEach(r => totalReps += r);
    }
  });

  document.getElementById('finishSummary').textContent =
    `${w.label} completed in ${m}:${s.toString().padStart(2,'0')} — ${totalSets} sets, ${totalReps} total reps.`;

  loadSettings();
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── Build log rows ──
function buildLogRows() {
  const w = WORKOUTS[currentDay];
  const rows = [];
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-US');
  const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

  w.exercises.forEach((ex, ei) => {
    if (!workoutState[ei]) return;
    for (let si = 0; si < ex.sets; si++) {
      const reps = workoutState[ei][si] ?? '';
      rows.push([dateStr, timeStr, currentDay, ex.name, si + 1, reps]);
    }
  });

  return rows;
}

// ── Save to Google Sheets via Apps Script ──
async function saveToSheets() {
  const scriptUrl = document.getElementById('scriptUrl').value.trim();

  if (!scriptUrl) {
    showToast('Paste your Apps Script URL first', 'error');
    return;
  }

  if (!scriptUrl.includes('script.google.com')) {
    showToast('That doesn\'t look like an Apps Script URL', 'error');
    return;
  }

  const rows = buildLogRows();
  if (rows.length === 0) {
    showToast('No sets logged yet', 'error');
    return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    // Use no-cors — Apps Script doesn't send CORS headers, so we
    // can't read the response, but the data still gets written.
    await fetch(scriptUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ rows })
    });

    // With no-cors we assume success if fetch didn't throw
    saveToHistory(rows.length);
    saveSettings();

    showToast(`✓ ${rows.length} sets saved to Google Sheets!`, 'success');
    btn.textContent = '✓ Saved!';
    setTimeout(() => {
      btn.textContent = 'Save again';
      btn.disabled = false;
    }, 3000);

  } catch (err) {
    console.error(err);
    let msg = err.message || 'Could not reach the script';
    if (msg.includes('Failed to fetch')) msg = 'Could not reach the script — check the URL and redeploy';
    showToast(msg, 'error');
    btn.disabled = false;
    btn.textContent = 'Save workout to Google Sheets';
  }
}

// ── Copy CSV ──
function copyWorkoutCSV() {
  const rows = buildLogRows();
  const header = ['Date', 'Time', 'Day', 'Exercise', 'Set', 'Reps'];
  const csv = [header, ...rows].map(r => r.join(',')).join('\n');

  navigator.clipboard.writeText(csv).then(() => {
    showToast('CSV copied to clipboard', 'success');
  }).catch(() => {
    // fallback: select a textarea
    const ta = document.createElement('textarea');
    ta.value = csv;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('CSV copied to clipboard', 'success');
  });
}

// ── History ──
function saveToHistory(setCount) {
  const entry = {
    day: currentDay,
    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
    sets: setCount,
    ts: Date.now()
  };
  workoutHistory.unshift(entry);
  if (workoutHistory.length > 20) workoutHistory = workoutHistory.slice(0, 20);
  try { localStorage.setItem('workout_history', JSON.stringify(workoutHistory)); } catch(e) {}
  renderHistory();
}

function renderHistory() {
  const sec = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (!workoutHistory.length) {
    sec.hidden = true;
    return;
  }
  sec.hidden = false;
  const colors = { A: 'var(--day-a)', B: 'var(--day-b)', C: 'var(--day-c)', D: 'var(--day-d)' };
  const bgs   = { A: 'var(--day-a-light)', B: 'var(--day-b-light)', C: 'var(--day-c-light)', D: 'var(--day-d-light)' };

  list.innerHTML = workoutHistory.slice(0, 5).map(h => `
    <div class="history-item">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="history-day" style="color:${colors[h.day]};background:${bgs[h.day]}">Day ${h.day}</span>
        <span class="history-date">${h.date}</span>
      </div>
      <span class="history-sets">${h.sets} sets</span>
    </div>`).join('');
}

function clearHistory() {
  workoutHistory = [];
  try { localStorage.removeItem('workout_history'); } catch(e) {}
  renderHistory();
}

// ── Persist settings ──
function saveSettings() {
  try {
    const url = document.getElementById('scriptUrl')?.value;
    if (url) localStorage.setItem('workout_scriptUrl', url);
  } catch(e) {}
}

function loadSettings() {
  try {
    const url = localStorage.getItem('workout_scriptUrl');
    const el = document.getElementById('scriptUrl');
    if (el && url) el.value = url;
  } catch(e) {}
}

// ── Toast ──
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
